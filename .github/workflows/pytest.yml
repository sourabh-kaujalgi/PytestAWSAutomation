name: SauceDemo Pytest AWS Automation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDWATCH_LOG_GROUP: ${{ vars.CLOUDWATCH_LOG_GROUP }}
      CLOUDWATCH_NAMESPACE: ${{ vars.CLOUDWATCH_NAMESPACE }}
      SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -v

      - name: Upload test reports to S3
        if: always()
        run: |
          if [ -d reports ]; then
            aws s3 cp reports/ \
              s3://${S3_BUCKET}/reports/ \
              --recursive
          else
            echo "reports directory does not exist"
          fi

      - name: Upload screenshots to S3
        if: always()
        run: |
          if [ -d screenshots ]; then
            aws s3 cp screenshots/ \
              s3://${S3_BUCKET}/screenshots/ \
              --recursive
          else
            echo "screenshots directory does not exist"
          fi