name: SauceDemo Pytest AWS CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDWATCH_LOG_GROUP: /qa/pytest
      CLOUDWATCH_NAMESPACE: QA/Pytest
      SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install --with-deps chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Pytest
        id: tests
        run: pytest

      - name: Upload GitHub artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-test-results-${{ github.run_id }}
          path: |
            reports/
            screenshots/
            logs/

      - name: Upload reports and screenshots to S3
        if: always()
        run: |
          aws s3 cp reports/ "s3://${S3_BUCKET}/pytest/${GITHUB_RUN_ID}/reports/" --recursive
          aws s3 cp screenshots/ "s3://${S3_BUCKET}/pytest/${GITHUB_RUN_ID}/screenshots/" --recursive || true
          aws s3 cp logs/ "s3://${S3_BUCKET}/pytest/${GITHUB_RUN_ID}/logs/" --recursive || true

      - name: Publish CloudWatch failure metric
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            FAILED=0
          else
            FAILED=1
          fi

          aws cloudwatch put-metric-data \
            --namespace "${CLOUDWATCH_NAMESPACE}" \
            --metric-name TestsFailed \
            --value "${FAILED}" \
            --unit Count

      - name: Send SNS notification on failure
        if: failure()
        run: |
          aws sns publish \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --subject "SauceDemo Pytest Failed - Run ${{ github.run_id }}" \
            --message "SauceDemo Pytest failed. Reports and screenshots are available in S3 under pytest/${GITHUB_RUN_ID}/"
